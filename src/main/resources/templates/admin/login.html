<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnivCode 관리자</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 40px; width: 360px; }
    h1 { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #888; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; transition: border-color .15s; }
    input:focus { border-color: #4f46e5; }
    .field { margin-bottom: 16px; }
    button[type=submit] { width: 100%; padding: 11px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button[type=submit]:hover { background: #4338ca; }
    .error { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <h1>UnivCode</h1>
  <p class="sub">관리자 계정으로 로그인하세요.</p>

  <div class="error" th:if="${error}" th:text="${error}"></div>

  <form method="post" action="/admin/login">
    <div class="field">
      <label for="username">아이디</label>
      <input id="username" type="text" name="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" type="password" name="password" required>
    </div>
    <button type="submit">로그인</button>
  </form>
</div>
</body>
</html>
