<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 API 키 — UnivCode</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f5f5; color:#111; }
    header { background:#fff; border-bottom:1px solid #e5e7eb; padding:0 32px; height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
    .brand { font-size:15px; font-weight:800; color:#4f46e5; }
    .header-right { display:flex; align-items:center; gap:14px; font-size:13px; color:#6b7280; }
    .logout-btn { padding:6px 14px; border:1px solid #d1d5db; background:#fff; border-radius:6px; font-size:13px; cursor:pointer; }
    .logout-btn:hover { background:#f3f4f6; }
    main { max-width:860px; margin:40px auto; padding:0 24px; display:flex; flex-direction:column; gap:20px; }
    h2 { font-size:18px; font-weight:700; }
    h3 { font-size:14px; font-weight:600; color:#374151; margin-bottom:16px; }
    section { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:28px; }
    .empty { text-align:center; padding:40px; color:#9ca3af; font-size:14px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:500; margin-left:8px; }
    .badge.active   { background:#dcfce7; color:#16a34a; }
    .badge.inactive { background:#f3f4f6; color:#6b7280; }
    .key-value-row { display:flex; align-items:center; gap:8px; }
    .key-value { font-family:monospace; font-size:15px; color:#111; }
    .key-value.masked { color:#9ca3af; font-style:italic; font-family:inherit; font-size:13px; }
    .copy-btn { padding:4px 10px; border:1px solid #ddd; background:#f9fafb; border-radius:4px; font-size:12px; cursor:pointer; }
    .key-meta { margin-top:8px; font-size:12px; color:#9ca3af; }
    .reissue-btn { margin-top:14px; padding:6px 14px; border:1px solid #fca5a5; background:#fff; color:#dc2626; border-radius:6px; font-size:12px; cursor:pointer; }
    .reissue-btn:hover { background:#fef2f2; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
    .modal { background:#fff; border-radius:10px; padding:28px; width:100%; max-width:420px; }
    .modal h3 { font-size:16px; font-weight:700; margin-bottom:8px; }
    .modal-desc { font-size:13px; color:#6b7280; margin-bottom:16px; }
    .modal-close { width:100%; padding:10px; background:#4f46e5; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; margin-top:16px; }
    .modal-close:hover { background:#4338ca; }
    .usage-today { margin-top:20px; }
    .usage-label { font-size:12px; color:#6b7280; margin-bottom:6px; }
    .usage-value { font-size:13px; font-weight:600; margin-bottom:8px; }
    .usage-bar { background:#f3f4f6; border-radius:99px; height:8px; overflow:hidden; }
    .usage-bar-fill { background:#4f46e5; height:100%; border-radius:99px; }
    .bar-chart { display:flex; align-items:flex-end; gap:6px; overflow-x:auto; padding-bottom:2px; }
    .bar-col { display:flex; flex-direction:column; align-items:center; flex:1; min-width:20px; }
    .bar-track { display:flex; align-items:flex-end; height:100px; width:100%; }
    .bar { width:100%; background:#6366f1; border-radius:3px 3px 0 0; }
    .bar-label { margin-top:6px; font-size:10px; color:#9ca3af; white-space:nowrap; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; padding:10px 12px; font-size:12px; font-weight:600; color:#6b7280; border-bottom:1px solid #e5e7eb; }
    td { padding:10px 12px; border-bottom:1px solid #f3f4f6; }
    tr:last-child td { border-bottom:none; }
    .method { font-family:monospace; font-weight:600; color:#4f46e5; }
    .banner { display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:6px; padding:10px 16px; font-size:13px; transition:opacity .3s ease; }
    .banner.hide { opacity:0; }
    .error-banner { background:#fef2f2; border:1px solid #fca5a5; color:#dc2626; }
    .banner-close { background:none; border:none; color:inherit; font-size:16px; line-height:1; cursor:pointer; padding:0 2px; opacity:.6; }
    .banner-close:hover { opacity:1; }
  </style>
</head>
<body>
<header>
  <span class="brand">UnivCode</span>
  <div class="header-right">
    <span th:text="${email}"></span>
    <form method="post" action="/my/logout">
      <button type="submit" class="logout-btn">로그아웃</button>
    </form>
  </div>
</header>
<main>
  <div class="banner error-banner" th:if="${error}">
    <span th:text="${error}"></span>
    <button type="button" class="banner-close" onclick="dismissBanner(this)">&times;</button>
  </div>

  <h2>내 API 키</h2>

  <section th:if="${key == null}">
    <div class="empty">발급된 API 키가 없습니다. 관리자에게 문의해주세요.</div>
  </section>

  <section th:if="${key != null}">
    <div class="key-value-row">
      <span class="key-value masked">키는 발급 시 한 번만 표시됩니다</span>
      <span class="badge active"   th:if="${key.status == 'ACTIVE'}">활성</span>
      <span class="badge inactive" th:if="${key.status == 'INACTIVE'}">비활성</span>
    </div>
    <div class="key-meta" th:text="'발급일 ' + ${#temporals.format(key.createdAt, 'yyyy-MM-dd')}"></div>
    <form method="post" action="/my/api-key/reissue"
          onsubmit="return confirm('재발급하면 기존 키는 즉시 사용할 수 없게 됩니다. 계속할까요?')">
      <button type="submit" class="reissue-btn">키 재발급</button>
    </form>

    <div class="usage-today">
      <div class="usage-label">오늘 호출</div>
      <div class="usage-value" th:text="${key.dailyCallCount} + ' / ' + ${key.dailyLimit}"></div>
      <div class="usage-bar">
        <div class="usage-bar-fill" th:style="'width:' + ${key.dailyCallCount * 100 / key.dailyLimit} + '%'"></div>
      </div>
    </div>
  </section>

  <section th:if="${key != null}">
    <h3>일별 호출량 (최근 14일)</h3>
    <div class="bar-chart">
      <div class="bar-col" th:each="p : ${dailyUsage}">
        <div class="bar-track">
          <div class="bar" th:style="'height:' + ${p.heightPercent} + '%'" th:title="${p.count} + '회'"></div>
        </div>
        <div class="bar-label" th:text="${p.label}"></div>
      </div>
    </div>
  </section>

  <section th:if="${key != null}">
    <h3>월별 호출량 (최근 6개월)</h3>
    <div class="bar-chart">
      <div class="bar-col" th:each="p : ${monthlyUsage}">
        <div class="bar-track">
          <div class="bar" th:style="'height:' + ${p.heightPercent} + '%'" th:title="${p.count} + '회'"></div>
        </div>
        <div class="bar-label" th:text="${p.label}"></div>
      </div>
    </div>
  </section>

  <section th:if="${key != null}">
    <h3>사용 로그</h3>
    <div class="empty" th:if="${#lists.isEmpty(logs)}">호출 기록이 없습니다.</div>
    <table th:unless="${#lists.isEmpty(logs)}">
      <thead>
        <tr>
          <th>시간</th>
          <th>메서드</th>
          <th>경로</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="l : ${logs}">
          <td th:text="${#temporals.format(l.calledAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
          <td class="method" th:text="${l.method}"></td>
          <td th:text="${l.path}"></td>
        </tr>
      </tbody>
    </table>
  </section>
</main>

<div class="modal-overlay" id="keyModal" th:if="${newApiKey}">
  <div class="modal">
    <h3>API 키가 발급됐습니다</h3>
    <p class="modal-desc">이 키는 지금 한 번만 표시됩니다. 안전한 곳에 복사해두세요.</p>
    <div class="key-value-row">
      <span class="key-value" id="newKv" th:text="${newApiKey}"></span>
      <button class="copy-btn" onclick="copyNewKey()">복사</button>
    </div>
    <button class="modal-close" onclick="closeKeyModal()">확인했습니다</button>
  </div>
</div>

<script>
  function copyNewKey() {
    navigator.clipboard.writeText(document.getElementById('newKv').textContent)
      .then(() => alert('복사됐습니다.'));
  }
  function closeKeyModal() {
    document.getElementById('keyModal').remove();
  }

  function dismissBanner(el) {
    const banner = el.closest('.banner');
    banner.classList.add('hide');
    setTimeout(() => banner.remove(), 300);
  }

  document.querySelectorAll('.banner').forEach(banner => {
    setTimeout(() => {
      banner.classList.add('hide');
      setTimeout(() => banner.remove(), 300);
    }, 2000);
  });
</script>
</body>
</html>
