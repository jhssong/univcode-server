<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — UnivCode</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f5f5; color:#111; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); padding:40px; width:100%; max-width:400px; }
    .logo { font-size:20px; font-weight:800; color:#4f46e5; margin-bottom:8px; }
    .subtitle { font-size:13px; color:#6b7280; margin-bottom:28px; }
    label { display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px; }
    input { width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:14px; margin-bottom:16px; }
    input:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 2px #eef2ff; }
    button[type=submit] { width:100%; padding:10px; background:#4f46e5; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
    button[type=submit]:hover { background:#4338ca; }
    .link { text-align:center; margin-top:20px; font-size:13px; color:#6b7280; }
    .link a { color:#4f46e5; text-decoration:none; }
    .error { background:#fef2f2; border:1px solid #fca5a5; color:#dc2626; border-radius:6px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">UnivCode</div>
  <div class="subtitle">개발자 API 키 신청을 위해 가입하세요.</div>

  <div class="error" th:if="${error}" th:text="${error}"></div>

  <form method="post" action="/signup">
    <label>이메일</label>
    <input type="email" name="email" placeholder="example@email.com" required>
    <label>소속명</label>
    <input type="text" name="affiliation" placeholder="소속 학교 또는 기관명" required>
    <label>비밀번호</label>
    <input type="password" name="password" placeholder="비밀번호 (8자 이상)" required>
    <button type="submit">가입하기</button>
  </form>

  <div class="link">이미 계정이 있으신가요? <a href="/login">로그인</a></div>
</div>
</body>
</html>
